<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cena Estudantil</title>
<style>
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef8f5;--cd:#fff;--tx:#0e2730;--mu:#587681;--bd:#cde2df;--in:#f5fbf9;--g:#12a46f;--b:#1f76d2;--r:#d44;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a21;--cd:#0e2832;--tx:#e5f4f0;--mu:#8cb0b6;--bd:#1c424b;--in:#0a1f27;--r:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071a21;--cd:#0e2832;--tx:#e5f4f0;--mu:#8cb0b6;--bd:#1c424b;--in:#0a1f27;--r:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;background:linear-gradient(90deg,var(--g),var(--b));color:#fff}
.lo{font-weight:800;font-size:18px}
#nv{display:flex;gap:4px;flex-wrap:wrap}
#nv button,.tg2 button{background:none;border:0;color:#fff;padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit}
#nv .on,.tg2 .on{background:#fff;color:#0b5a7a}
.tg2{display:flex;background:rgba(0,0,0,.2);border-radius:99px}
.chip{margin-right:8px;font-size:13px}
.wrap{max-width:1050px;margin:0 auto;padding:18px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}
.btn{background:linear-gradient(90deg,var(--g),var(--b));color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:5px 10px;font-size:13px;margin:2px;background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.btn.r{color:var(--r)}
.lk{background:none;border:0;color:var(--b);cursor:pointer;font:inherit;padding:4px 0}
.mu,small{color:var(--mu)}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.hero{position:relative;overflow:hidden;isolation:isolate;background:#04141a;color:#fff;border-radius:16px;margin-bottom:16px;min-height:300px}.hero .art{position:absolute;inset:0;z-index:-1}.hero .art svg{width:100%;height:100%;display:block}.ht{padding:34px 28px;max-width:560px}.hm{position:relative;isolation:isolate;margin-bottom:16px}.hm .art{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:100vw;height:660px;z-index:-1;overflow:hidden}.hm .art svg{width:100%;height:100%;display:block}.hm .art::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,var(--bg) 98%)}.hm .ht{min-height:400px;padding:56px 28px 28px;color:#fff}.hm .ht p{margin:0 0 4px;text-shadow:0 1px 8px rgba(0,0,0,.6)}.lgh{min-height:min(520px,75vh)}body{overflow-x:hidden}.hero h1,.ht h1{font-size:clamp(28px,5vw,46px);line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.65)}.bg{color:#2fe0a6;font-weight:800;font-size:12px;letter-spacing:.2em}.hb{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.hb button{border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}.hb .w{background:#fff;color:#111}.hb .g{background:rgba(120,150,160,.5);color:#fff}.ht input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28)}.ht input::placeholder{color:#cfe9e2}.hero .card{color:var(--tx)}.hero .card small{color:var(--mu)}.lgh .lg{position:relative;padding:34px 28px;min-height:0}
.hero p{margin:0 0 4px;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.6)}.hero .card p{text-shadow:none;opacity:1}
.cols{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
.cols2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.c2,.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.th{height:130px;position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}.th img,.pl16 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl{position:relative;z-index:1;font-style:normal;background:#fff;color:#111;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tt{position:absolute;left:12px;right:12px;bottom:10px;font-weight:800;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.45);color:#fff}.tg{z-index:1;position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.cb{padding:12px;display:grid;gap:4px}
.rw,.hd,.bar,.li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st{color:#d99a00;font-size:13px}
.bar{margin-bottom:12px}.bar select{width:auto}.hd{margin-bottom:12px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px;text-transform:uppercase}.ac{white-space:nowrap}
.bd{padding:2px 9px;border-radius:99px;font-size:12px}.ok{background:#12a46f33;color:var(--g)}.no{background:#d4444433;color:var(--r)}
.side .lk{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px}.side .on{background:var(--in);font-weight:700}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}.kp b{font-size:28px;display:block}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bars i{width:100%;background:linear-gradient(var(--g),var(--b));border-radius:6px 6px 0 0}
.pl16{position:relative;padding-top:56.25%;cursor:pointer;border-radius:14px;overflow:hidden;margin-bottom:12px}
.pl16 iframe,.pl16 video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.pl.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;font-size:26px}
.stars button{background:none;border:0;font-size:30px;color:var(--bd);cursor:pointer}.stars .on{color:#e8a900}
.cmt{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}.cmt p{margin:2px 0}
.li{padding:6px 0;border-bottom:1px solid var(--bd)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}dt{color:var(--mu)}dd{margin:0}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center;min-height:60vh}
.lg h1{font-size:40px;line-height:1.1}.lg em{font-style:normal;color:var(--g)}
.ck{display:flex;gap:8px;align-items:center;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:12px;color:var(--tx)}.ck input{width:auto}
.cr{text-align:center;padding:40px}
.nm{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0e2730;color:#fff;padding:10px 18px;border-radius:10px;z-index:9;max-width:90%}
@media(max-width:760px){.cols,.cols2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="lo">▶ Cena Estudantil</div>
  <nav id="nv"></nav>
  <div id="ur"></div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" hidden></div>

<script>
/* ===== BANCO DE DADOS (tabelas do dicionário de dados, salvas no localStorage) ===== */
const K='cena_db_v2';
let db,user=null,view='login',arg=null,modo='login',tent={};
const F={q:'',g:'',d:'',t:'',a:'',o:'rec'},U={q:'',t:'',s:''},V={};
const $=i=>document.getElementById(i);
const H=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return String(h)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=t=>Math.max(0,...db[t].map(r=>r['id_'+t]))+1;

function seed(){
  const d=db={usuario:[],producao:[],genero:[],disciplina:[],turma:[],autor:[],prod_autor:[],avaliacao:[],comentario:[]};
  const L=(t,a)=>a.forEach((n,i)=>d[t].push({['id_'+t]:i+1,[t=='turma'?'identificacao':'nome']:n}));
  L('genero',['Entrevista','Curta-metragem','Documentário','Videoclipe','Animação','Reportagem']);
  L('disciplina',['Programação','Artes','História','Português','Biologia','Geografia']);
  L('turma',['1º A','2º B','3º A','3º B']);
  d.usuario.push({id_usuario:1,nome:'Administrador',email:'ribeiro.dantas@academico.ifpb.edu.br',senha:H('12345678'),tipo_usuario:'Gerente',status:'ATIVO'});
  save();return d;
}
function load(){try{const t=localStorage.getItem(K);if(t){db=JSON.parse(t);return}}catch(e){}db=seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Não foi possível salvar: armazenamento cheio.')}}
function setAutores(idp,nomes){
  db.prod_autor=db.prod_autor.filter(x=>x.id_producao!=idp);
  nomes.forEach(n=>{
    let a=db.autor.find(x=>x.nome.toLowerCase()==n.toLowerCase());
    if(!a){a={id_autor:nid('autor'),nome:n};db.autor.push(a)}
    db.prod_autor.push({id_autor:a.id_autor,id_producao:idp});
  });
}

/* ===== FUNÇÕES AUXILIARES ===== */
const rows=t=>db[t].map(r=>[r['id_'+t],r.nome||r.identificacao]);
const nome=(t,id)=>{const r=db[t].find(x=>x['id_'+t]==id);return r?(r.nome||r.identificacao):'—'};
const autores=id=>db.prod_autor.filter(x=>x.id_producao==id).map(x=>nome('autor',x.id_autor));
const media=id=>{const a=db.avaliacao.filter(x=>x.id_producao==id);return{m:a.length?a.reduce((s,x)=>s+x.nota,0)/a.length:0,n:a.length}};
const vid=u=>{u=String(u).trim();let m;if(!/^https?:\/\//i.test(u))return null;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))return{n:'YouTube',emb:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&autoplay=`,th:`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{n:'Vimeo',emb:`https://player.vimeo.com/video/${m[1]}?autoplay=`};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{n:'Google Drive',emb:`https://drive.google.com/file/d/${m[1]}/preview?autoplay=`,th:`https://drive.google.com/thumbnail?id=${m[1]}&sz=w640`};
  if(/^https?:\/\/\S+\.(mp4|webm|ogg)(\?\S*)?$/i.test(u))return{n:'arquivo de vídeo',file:u};
  return null};
const grad=p=>{const h=140+(p.id_producao*37)%60;return `linear-gradient(135deg,hsl(${h} 65% 38%),hsl(${h+40} 65% 28%))`};
const thumb=p=>{if(p.capa)return `<img src="${p.capa}" alt="">`;const v=vid(p.link_video);if(!v||!v.th)return'';const id=(v.th.match(/vi\/([\w-]{11})/)||[])[1];
  const alt=id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg|https://img.youtube.com/vi/${id}/mqdefault.jpg`:'';
  return `<img src="${esc(v.th)}" alt="" data-a="${alt}" onerror="tf(this)">`};
const redim=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const w=Math.min(480,i.width),h=Math.round(i.height*w/i.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);ok(c.toDataURL('image/jpeg',.75))};i.src=r.result};r.readAsDataURL(f)});
function tf(i){const l=i.dataset.a?i.dataset.a.split('|'):[],n=l.shift();if(n){i.dataset.a=l.join('|');i.src=n}else i.remove()}
const pode=p=>user&&(user.tipo_usuario=='Gerente'||p.id_usuario==user.id_usuario);
const opts=(l,c,ph)=>(ph?`<option value="">${ph}</option>`:'')+l.map(([v,t])=>`<option value="${v}"${c==v?' selected':''}>${esc(t)}</option>`).join('');
const anos=()=>[...new Set(db.producao.map(p=>p.ano_producao))].sort((a,b)=>b-a).map(a=>[a,a]);
const ys=()=>Array.from({length:8},(_,i)=>new Date().getFullYear()-i).map(a=>[a,a]);
const fs=(k,t,ph)=>`<select onchange="F.${k}=this.value;upd()">${opts(t=='ano'?anos():rows(t),F[k],ph)}</select>`;
const ai=v=>`<div><input class="au" value="${esc(v)}" placeholder="Nome do autor"></div>`;
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)}
const home=()=>user&&user.tipo_usuario=='Gerente'?'prods':'home';

/* ===== NAVEGAÇÃO E RENDERIZAÇÃO ===== */
function go(v,a){if(v!=view&&['home','minhas','prods'].includes(v))Object.assign(F,{q:'',g:'',d:'',t:'',a:''});view=v;arg=a;render();scrollTo(0,0)}
function sair(){user=null;view='login';render()}
function nav(){
  const g=user&&user.tipo_usuario=='Gerente';
  const it=!user?[['login','Entrar']]:g?[['painel','Painel']]:[['home','Início'],['novo','Enviar produção'],['minhas','Minhas produções']];
  $('nv').innerHTML=it.concat([['criador','Criador']]).map(([k,l])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('ur').innerHTML=user?`<span class="chip">${esc(user.nome)} · ${user.tipo_usuario}</span><button class="btn s" onclick="sair()">Sair</button>`
    :'';
}
function render(){
  if(!user&&view!='criador')view='login';
  nav();$('app').innerHTML=V[view]();
  if($('lst')||$('tb'))upd();
  if($('ub'))ut();
}

/* ===== LOGIN E CADASTRO (RF01, RF02, RF03, RNF05, RNF06) ===== */
V.login=()=>`<section class="hero lgh"><div class="art">${ART}</div><div class="lg"><section><h1>Toda cena tem uma <em>história.</em></h1><p>A plataforma que reúne, organiza e divulga as produções audiovisuais dos estudantes em um só lugar.</p></section>
<div class="card">${modo=='login'?`<h2>Entrar</h2><label>E-mail<input id="em" placeholder="seuemail@exemplo.com"></label><label>Senha<input id="se" type="password"></label>
<label class="ck"><input type="checkbox" id="cp"> Não sou um robô</label><button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
<p><button class="lk" onclick="modo='cad';render()">Criar conta</button></p>`
:`<h2>Criar conta</h2><label>Nome<input id="cn"></label><label>E-mail<input id="em"></label><label>Senha (mínimo 6)<input id="se" type="password"></label>
<label>Tipo<select id="ct"><option>Estudante</option><option>Professor</option></select></label><button class="btn" style="width:100%" onclick="cadastrar()">Cadastrar</button>
<p><button class="lk" onclick="modo='login';render()">Já tenho conta</button></p>`}</div></div></section>`;
function entrar(){
  const e=$('em').value.trim().toLowerCase(),s=$('se').value,t=tent[e]||{n:0,ate:0};
  if(!e||!s)return toast('Informe e-mail e senha.');
  if(!$('cp').checked)return toast('Confirme que você não é um robô.');
  if(Date.now()<t.ate)return toast('Conta bloqueada temporariamente. Tente novamente em instantes.');
  const u=db.usuario.find(x=>x.email.toLowerCase()==e&&x.senha==H(s));
  if(!u){t.n++;if(t.n>=5){t.ate=Date.now()+60000;t.n=0;toast('Cinco tentativas incorretas: conta bloqueada por 1 minuto.')}else toast('E-mail ou senha incorretos. Tentativa '+t.n+' de 5.');tent[e]=t;return}
  if(u.status!='ATIVO')return toast('Este usuário foi bloqueado pelo gerente.');
  tent[e]={n:0,ate:0};user=u;go(u.tipo_usuario=='Gerente'?'painel':'home');
}
function cadastrar(){
  const n=$('cn').value.trim(),e=$('em').value.trim().toLowerCase(),s=$('se').value;
  if(!n||!e||s.length<6)return toast('Preencha nome, e-mail e senha (mínimo 6 caracteres).');
  if(!/^\S+@\S+\.\S+$/.test(e))return toast('E-mail inválido.');
  if(db.usuario.some(x=>x.email.toLowerCase()==e))return toast('Este e-mail já está cadastrado.');
  db.usuario.push({id_usuario:nid('usuario'),nome:n,email:e,senha:H(s),tipo_usuario:$('ct').value,status:'ATIVO'});
  save();modo='login';toast('Cadastro realizado! Faça login.');render();
}

/* ===== CATÁLOGO, PESQUISA E FILTROS (RF14 a RF18) ===== */
const cat=()=>`<div class="cols"><aside class="card"><h3>Filtros</h3><label>Gênero${fs('g','genero','Todos')}</label><label>Disciplina${fs('d','disciplina','Todas')}</label><label>Turma${fs('t','turma','Todas')}</label><label>Ano${fs('a','ano','Todos')}</label><button class="btn s" onclick="limpar()">Limpar filtros</button></aside>
<div><div class="bar"><span id="cnt" class="mu"></span><select onchange="F.o=this.value;upd()">${opts([['rec','Mais recentes'],['nota','Melhor avaliadas'],['az','Título A–Z']],F.o)}</select></div><div class="grid" id="lst"></div></div></div>`;
const ART=`<svg preserveAspectRatio="xMaxYMid slice" viewBox="0 0 1000 400" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04141a"/><stop offset=".6" stop-color="#06303a"/><stop offset="1" stop-color="#0a3f7a"/></linearGradient>
<radialGradient id="cg1" cx="75%" cy="45%" r="45%"><stop offset="0" stop-color="#12a46f" stop-opacity=".55"/><stop offset="1" stop-color="#12a46f" stop-opacity="0"/></radialGradient>
<radialGradient id="cg2" cx="95%" cy="90%" r="40%"><stop offset="0" stop-color="#1f76d2" stop-opacity=".65"/><stop offset="1" stop-color="#1f76d2" stop-opacity="0"/></radialGradient>
<linearGradient id="cbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cfl" x1="0" y1="0" x2="1" y2="0"><stop offset=".25" stop-color="#04141a" stop-opacity=".97"/><stop offset=".7" stop-color="#04141a" stop-opacity=".35"/><stop offset="1" stop-color="#04141a" stop-opacity="0"/></linearGradient>
<linearGradient id="cfb" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#04141a" stop-opacity="0"/><stop offset="1" stop-color="#04141a" stop-opacity=".9"/></linearGradient>
<linearGradient id="cp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16c28a"/><stop offset="1" stop-color="#0b5a7a"/></linearGradient>
<linearGradient id="cp2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2aa6ff"/><stop offset="1" stop-color="#12a46f"/></linearGradient>
<linearGradient id="cp3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fd19a"/><stop offset="1" stop-color="#1f76d2"/></linearGradient>
<linearGradient id="cp4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f76d2"/><stop offset="1" stop-color="#0a2a5e"/></linearGradient>
<pattern id="cfp" width="26" height="14" patternUnits="userSpaceOnUse"><rect x="6" y="3" width="12" height="8" rx="2" fill="#fff" fill-opacity=".13"/></pattern>
<filter id="cs" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".65"/></filter>
<g id="cpc"><circle cx="65" cy="92" r="24" fill="#fff" fill-opacity=".93"/><path d="M57 79l24 13-24 13z" fill="#0b3a4a"/><rect x="14" y="146" width="92" height="9" rx="4.5" fill="#fff" fill-opacity=".88"/><rect x="14" y="163" width="60" height="7" rx="3.5" fill="#fff" fill-opacity=".5"/><rect x="14" y="14" width="44" height="16" rx="8" fill="#000" fill-opacity=".38"/></g>
</defs>
<rect width="1000" height="400" fill="url(#cab)"/>

V.home=()=>`<div class="hm"><div class="art">${ART}</div><div class="ht"><span class="bg">CENA ESTUDANTIL</span><h1>Descubra o que a turma anda criando</h1><p>Pesquise, assista, avalie e comente as produções audiovisuais dos estudantes.</p><div class="hb"><button class="w" onclick="$('lst').scrollIntoView({behavior:'smooth'})">▶ Explorar produções</button><button class="g" onclick="go('novo')">+ Enviar produção</button></div><input id="q" placeholder="Pesquisar produções por título…" value="${esc(F.q)}" oninput="F.q=this.value;upd()"></div>`+cat()+`</div>`;
V.minhas=()=>`<h2>Minhas produções</h2>`+cat();
function limpar(){Object.assign(F,{q:'',g:'',d:'',t:'',a:''});render()}
function filtrar(min){
  const l=db.producao.filter(p=>(!min||p.id_usuario==user.id_usuario)&&(!F.q||p.titulo.toLowerCase().includes(F.q.toLowerCase()))&&(!F.g||p.id_genero==F.g)&&(!F.d||p.id_disciplina==F.d)&&(!F.t||p.id_turma==F.t)&&(!F.a||p.ano_producao==F.a));
  return l.sort(F.o=='nota'?(x,y)=>media(y.id_producao).m-media(x.id_producao).m:F.o=='az'?(x,y)=>x.titulo.localeCompare(y.titulo):(x,y)=>y.ano_producao-x.ano_producao||y.id_producao-x.id_producao);
}
const card=p=>{const m=media(p.id_producao);
  return `<div class="vc"><div class="th" style="background:${grad(p)}" onclick="go('det',${p.id_producao});tocar(${p.id_producao})"><span class="tt">${esc(p.titulo)}</span>${thumb(p)}<span class="tg">${esc(nome('genero',p.id_genero))}</span><i class="pl">▶</i></div>
<div class="cb"><b>${esc(p.titulo)}</b><small>${nome('disciplina',p.id_disciplina)} · ${nome('turma',p.id_turma)} · ${p.ano_producao}</small>
<div class="rw"><span class="st">★ ${m.n?m.m.toFixed(1):'–'} (${m.n})</span><button class="lk" onclick="go('det',${p.id_producao})">Ver detalhes →</button></div></div></div>`};
const cardAdm=p=>{const m=media(p.id_producao);
  return `<div class="vc"><div class="th" style="background:${grad(p)}" onclick="go('det',${p.id_producao});tocar(${p.id_producao})"><span class="tt">${esc(p.titulo)}</span>${thumb(p)}<span class="tg">${esc(nome('genero',p.id_genero))}</span><i class="pl">▶</i></div>
<div class="cb"><b>${esc(p.titulo)}</b><small>${nome('disciplina',p.id_disciplina)} · ${nome('turma',p.id_turma)} · ${p.ano_producao}</small><small>Autores: ${esc(autores(p.id_producao).join(', '))}</small><small>Enviado por: ${esc(nome('usuario',p.id_usuario))}</small>
<div class="rw"><span class="st">★ ${m.n?m.m.toFixed(1):'–'} (${m.n})</span><button class="lk" onclick="go('det',${p.id_producao})">Ver detalhes →</button></div></div></div>`};
function upd(){
  const l=filtrar(view=='minhas');
  if(view=='prods'){
    $('tb').innerHTML=l.map(p=>`<tr><td><b>${esc(p.titulo)}</b></td><td>${esc(autores(p.id_producao).join(', '))}</td><td>${nome('disciplina',p.id_disciplina)}</td><td>${nome('turma',p.id_turma)}</td><td>${p.ano_producao}</td><td class="ac"><button class="btn s" onclick="go('det',${p.id_producao})">Ver</button><button class="btn s" onclick="go('novo',${p.id_producao})">Editar</button><button class="btn s r" onclick="del(${p.id_producao},this)">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma produção encontrada.</td></tr>';
    return;
  }
  $('cnt').textContent=l.length+' produções encontradas';
  $('lst').innerHTML=l.map(card).join('')||`<p class="mu">${db.producao.length?'Nenhuma produção encontrada.':'Nenhuma produção cadastrada ainda. Use “Enviar produção” para adicionar a primeira!'}</p>`;
}

/* ===== CADASTRO / EDIÇÃO / EXCLUSÃO DE PRODUÇÕES (RF04 a RF13) ===== */
V.novo=()=>{
  const p=arg?db.producao.find(x=>x.id_producao==arg)||{}:{},au=arg?autores(arg):[''];
  return `<div class="card"><h2>${arg?'Editar produção':'Cadastrar nova produção'}</h2><div class="f2"><div>
<label>Título *<input id="f_t" value="${esc(p.titulo)}" placeholder="Digite o título"></label>
<label>Descrição *<textarea id="f_d">${esc(p.descricao)}</textarea></label>
<label>Link do vídeo (YouTube, Vimeo, Google Drive ou .mp4) *<input id="f_l" value="${esc(p.link_video)}" placeholder="https://youtube.com/watch?v=…"></label>
<label>Capa do vídeo (imagem, opcional)<input id="f_c" type="file" accept="image/*"></label><small>Sem imagem, o site usa a capa do YouTube. Se ela não carregar, envie uma imagem aqui.</small>
<label>Autores * (mínimo 1)</label><div id="aut">${au.map(ai).join('')}</div><button class="btn s" onclick="$('aut').insertAdjacentHTML('beforeend',ai(''))">+ Adicionar</button></div>
<div><label>Gênero<select id="f_g">${opts(rows('genero'),p.id_genero,'Selecione')}</select></label>
<label>Disciplina *<select id="f_s">${opts(rows('disciplina'),p.id_disciplina,'Selecione')}</select></label>
<label>Turma *<select id="f_u">${opts(rows('turma'),p.id_turma,'Selecione')}</select></label>
<label>Ano de produção *<select id="f_a">${opts(ys(),p.ano_producao,'Selecione')}</select></label><small>* campos obrigatórios</small></div></div>
<div class="hd"><span></span><div><button class="btn s" onclick="go(home())">Cancelar</button> <button class="btn" onclick="salvar()">${arg?'Salvar alterações':'Cadastrar produção'}</button></div></div></div>`;
};
async function salvar(){
  const v=i=>$(i).value.trim(),au=[...document.querySelectorAll('.au')].map(x=>x.value.trim()).filter(Boolean);
  if(!v('f_t')||!v('f_d')||!v('f_l')||!au.length||!v('f_s')||!v('f_u')||!v('f_a'))return toast('Preencha todos os campos obrigatórios (*), com ao menos um autor.');
  if(!vid(v('f_l')))return toast('Informe um link válido (YouTube, Vimeo, Google Drive ou arquivo .mp4/.webm).');
  const dados={titulo:v('f_t'),descricao:v('f_d'),link_video:v('f_l'),ano_producao:+v('f_a'),id_genero:v('f_g')?+v('f_g'):null,id_disciplina:+v('f_s'),id_turma:+v('f_u')};
  const f=$('f_c').files[0];
  if(f){try{dados.capa=await redim(f)}catch(e){return toast('Não foi possível ler a imagem da capa.')}}
  let p=arg&&db.producao.find(x=>x.id_producao==arg);
  if(p){if(!pode(p))return;Object.assign(p,dados)}
  else{p={id_producao:nid('producao'),id_usuario:user.id_usuario,...dados};db.producao.push(p)}
  setAutores(p.id_producao,au);save();toast('Produção salva!');go(home());
}
function del(id,b){
  if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar?';return}
  const p=db.producao.find(x=>x.id_producao==id);if(!p||!pode(p))return;
  db.producao=db.producao.filter(x=>x.id_producao!=id);
  ['avaliacao','comentario','prod_autor'].forEach(t=>db[t]=db[t].filter(x=>x.id_producao!=id));
  save();toast('Produção excluída.');go(home());
}

/* ===== VISUALIZAÇÃO, AVALIAÇÕES E COMENTÁRIOS (RF19 a RF24) ===== */
V.det=()=>{
  const p=db.producao.find(x=>x.id_producao==arg);if(!p)return V.home();
  const m=media(p.id_producao),v=vid(p.link_video),meu=db.avaliacao.find(a=>a.id_producao==p.id_producao&&a.id_usuario==user.id_usuario);
  const cm=db.comentario.filter(c=>c.id_producao==p.id_producao).sort((a,b)=>b.id_comentario-a.id_comentario);
  return `<button class="lk" onclick="go(home())">← Voltar para a lista</button><div class="cols2"><div>
<div class="pl16" id="pl" style="background:${grad(p)}" onclick="tocar(${p.id_producao})">${thumb(p)}<i class="pl big">▶</i></div>
${location.protocol=='file:'&&v&&v.n=='YouTube'?'<p><small>Aviso: com o site aberto direto do arquivo (file://), o YouTube pode bloquear o player. Abra por localhost ou hospedagem, ou use o botão abaixo.</small></p>':''}
<h2>${esc(p.titulo)}</h2><a class="btn s" href="${esc(p.link_video)}" target="_blank" rel="noopener">Abrir no ${v?v.n:'site original'} ↗</a>
${pode(p)?`<button class="btn s" onclick="go('novo',${p.id_producao})">Editar</button><button class="btn s r" onclick="del(${p.id_producao},this)">Excluir</button>`:''}
<div class="card" style="margin-top:12px"><h3>Comentários (${cm.length})</h3><textarea id="cm" placeholder="Escreva seu comentário…"></textarea><p><button class="btn" onclick="coment(${p.id_producao})">Comentar</button></p>
${cm.map(c=>`<div class="cmt"><b>${esc(nome('usuario',c.id_usuario))}</b> <small>${new Date(c.data_comentario).toLocaleString('pt-BR')}</small><p>${esc(c.texto)}</p></div>`).join('')||'<p class="mu">Seja o primeiro a comentar.</p>'}</div></div>
<aside><div class="card"><h3>Informações da produção</h3><dl><dt>Autores</dt><dd>${esc(autores(p.id_producao).join(', '))}</dd><dt>Gênero</dt><dd>${esc(nome('genero',p.id_genero))}</dd><dt>Disciplina</dt><dd>${esc(nome('disciplina',p.id_disciplina))}</dd><dt>Turma</dt><dd>${esc(nome('turma',p.id_turma))}</dd><dt>Ano</dt><dd>${p.ano_producao}</dd></dl><p>${esc(p.descricao)}</p></div>
<div class="card"><h3>Avaliação</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${meu&&meu.nota>=n?'on':''}" onclick="avaliar(${p.id_producao},${n})">★</button>`).join('')}</div><small>Média ${m.n?m.m.toFixed(1):'–'} · ${m.n} avaliações</small></div></aside></div>`;
};
function tocar(id){
  const p=db.producao.find(x=>x.id_producao==id),v=p&&vid(p.link_video),b=$('pl');if(!v||!b)return;
  b.onclick=null;b.style.cursor='default';
  b.innerHTML=v.file?`<video src="${esc(v.file)}" controls autoplay playsinline></video>`
    :`<iframe src="${esc(v.emb)}1" title="${esc(p.titulo)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}
function coment(id){
  const t=$('cm').value.trim();if(!t)return toast('O comentário não pode ser vazio.');
  db.comentario.push({id_comentario:nid('comentario'),texto:t,data_comentario:new Date().toISOString(),id_usuario:user.id_usuario,id_producao:id});save();render();
}
function avaliar(id,n){
  const a=db.avaliacao.find(x=>x.id_producao==id&&x.id_usuario==user.id_usuario);
  a?a.nota=n:db.avaliacao.push({id_avaliacao:nid('avaliacao'),id_usuario:user.id_usuario,id_producao:id,nota:n});save();render();
}

V.painel=()=>{
  const pr=db.producao,av=db.avaliacao,an=anos().reverse(),mx=Math.max(1,...an.map(([a])=>pr.filter(p=>p.ano_producao==a).length));
  return adm('painel',`<div class="hd"><h2>Painel do gerente</h2><button class="btn" onclick="go('novo',null)">+ Nova produção</button></div>
<div class="kp">${[['Produções',pr.length],['Usuários',db.usuario.length],['Comentários',db.comentario.length],['Avaliação média',av.length?(av.reduce((s,x)=>s+x.nota,0)/av.length).toFixed(1)+' ★':'–']].map(([l,v])=>`<div class="card"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
<div class="card"><h3>Produções por ano</h3><div class="bars">${an.length?'':'<small>Nenhuma produção cadastrada ainda.</small>'}${an.map(([a])=>{const n=pr.filter(p=>p.ano_producao==a).length;return `<div><span>${n}</span><i style="height:${n/mx*100}px"></i><small>${a}</small></div>`}).join('')}</div></div>
<div class="card"><h3>Últimas produções cadastradas</h3><div class="grid">${[...pr].sort((a,b)=>b.id_producao-a.id_producao).slice(0,6).map(cardAdm).join('')||'<p class="mu">Nenhuma produção cadastrada ainda.</p>'}</div></div>`);
};

V.users=()=>adm('users',`<h2>Gerenciar usuários</h2><div class="fr"><input placeholder="Pesquisar por nome ou e-mail…" value="${esc(U.q)}" oninput="U.q=this.value;ut()">
<select onchange="U.t=this.value;ut()">${opts([['Estudante','Estudante'],['Professor','Professor'],['Gerente','Gerente']],U.t,'Tipo: todos')}</select>
<select onchange="U.s=this.value;ut()">${opts([['ATIVO','Ativo'],['BLOQUEADO','Bloqueado']],U.s,'Status: todos')}</select></div>
<div class="tw card"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Tipo</th><th>Status</th><th></th></tr></thead><tbody id="ub"></tbody></table></div>`);
function ut(){
  const q=U.q.toLowerCase();
  $('ub').innerHTML=db.usuario.filter(u=>(!q||(u.nome+u.email).toLowerCase().includes(q))&&(!U.t||u.tipo_usuario==U.t)&&(!U.s||u.status==U.s)).map(u=>
    `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${u.tipo_usuario}</td><td><span class="bd ${u.status=='ATIVO'?'ok':'no'}">${u.status=='ATIVO'?'Ativo':'Bloqueado'}</span></td>
<td class="ac">${u.tipo_usuario=='Gerente'?'':`<button class="btn s" onclick="tipo(${u.id_usuario})">Alterar tipo</button><button class="btn s r" onclick="bloq(${u.id_usuario})">${u.status=='ATIVO'?'Bloquear':'Desbloquear'}</button>`}</td></tr>`).join('');
}
function tipo(id){const u=db.usuario.find(x=>x.id_usuario==id);u.tipo_usuario=u.tipo_usuario=='Estudante'?'Professor':'Estudante';save();ut()}
function bloq(id){const u=db.usuario.find(x=>x.id_usuario==id);u.status=u.status=='ATIVO'?'BLOQUEADO':'ATIVO';save();ut()}

/* ===== ABA CRIADOR ===== */
V.criador=()=>`<div class="card cr"><h2>Criador</h2><p class="nm">Rafael Ribeiro Dantas e Claude</p><small>Plataforma Digital para Produções Audiovisuais Estudantis · Projeto Integrador · IFPB</small></div>`;

/* ===== INÍCIO ===== */
function garantirGerente(){
  const e='ribeiro.dantas@academico.ifpb.edu.br',h=H('12345678');let g=db.usuario.find(x=>x.email.toLowerCase()==e);
  if(!g){db.usuario.push({id_usuario:nid('usuario'),nome:'Administrador',email:e,senha:h,tipo_usuario:'Gerente',status:'ATIVO'});save()}
  else if(g.tipo_usuario!='Gerente'||g.senha!=h||g.status!='ATIVO'){Object.assign(g,{tipo_usuario:'Gerente',senha:h,status:'ATIVO'});save()}
}
load();garantirGerente();render();
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&!user&&view=='login')modo=='login'?entrar():cadastrar()});
</script>
